<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}StockPilot{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 0;
            background: #eff6ff;
            color: #1e293b;
        }
        nav {
            background: #1e3a8a;
            padding: 14px 24px;
        }
        nav a {
            color: #dbeafe;
            text-decoration: none;
            margin-right: 20px;
            font-weight: 500;
        }
        nav a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        main {
            max-width: 960px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h2 {
            color: #1e3a8a;
            border-bottom: 2px solid #93c5fd;
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 1px 3px rgba(30, 58, 138, 0.15);
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #dbeafe;
        }
        th {
            background: #bfdbfe;
            color: #1e3a8a;
        }
        form {
            margin: 20px 0;
        }
        input, button {
            padding: 8px 10px;
            font-size: 14px;
        }
        input {
            border: 1px solid #93c5fd;
            border-radius: 4px;
        }
        button {
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #1e40af;
        }
        ul {
            padding-left: 18px;
            margin: 0;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'dashboard:home' %}">Dashboard</a>
        <a href="{% url 'inventory:product_list' %}">Inventory</a>
        <a href="{% url 'orders:order_list' %}">Orders</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
