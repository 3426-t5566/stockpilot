{% extends "base.html" %}
{% block title %}New Order{% endblock %}
{% block content %}
<h2>New Order</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <h3>Items</h3>
    {{ formset.management_form }}
    {% for item_form in formset %}
        {{ item_form.as_p }}
    {% endfor %}
    <button type="submit">Save Order</button>
</form>
{% endblock %}
